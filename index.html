<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>芯祥产品目录 · 逻辑器件与模拟开关选型</title>
  <meta name="description" content="芯祥科技产品选型平台：670 款逻辑器件与模拟开关，含 74HC/74HCT/74HCS/74LVC/74AHC 全系列。支持按功能、封装、电压、温度筛选，提供规格书、引脚图、应用电路与 P2P 替代查询。">
  <meta name="keywords" content="芯祥,逻辑器件,74HC,74HCT,74HCS,74LVC,74AHC,模拟开关,选型,P2P替代,数据手册">
  <meta name="author" content="芯祥科技">
  <meta name="theme-color" content="#2f8f86">
  <!-- 社交分享预览（微信/钉钉/飞书/Slack 等读取） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="芯祥产品目录">
  <meta property="og:title" content="芯祥产品目录 · 逻辑器件与模拟开关选型">
  <meta property="og:description" content="670 款逻辑器件与模拟开关，含规格书、引脚图、应用电路与 P2P 替代查询。">
  <meta property="og:url" content="https://logic-qbu.pages.dev/">
  <meta property="og:image" content="https://logic-qbu.pages.dev/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="芯祥产品目录 · 逻辑器件与模拟开关选型">
  <meta name="twitter:description" content="670 款逻辑器件与模拟开关，含规格书、引脚图、应用电路与 P2P 替代查询。">
  <meta name="twitter:image" content="https://logic-qbu.pages.dev/og-cover.png">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css?v=20260926i">
  <!-- 主题预置：必须同步执行，避免深色下闪白 -->
  <script src="./theme-init.js?v=20260926i"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo">EM</div>
        <div class="brand-text">
          <h1>芯祥产品目录</h1>
        </div>
      </div>
      <div class="topbar-side">
        <div class="topbar-search">
          <input id="q" type="search" autocomplete="off"
                 placeholder="搜索型号，如 EM74LVC1G08、EM74AHC1G00（按 / 聚焦）">
        </div>
        <div class="topstats">
          <div class="stat"><b id="statModels">-</b><span>型号</span></div>
          <div class="stat"><b id="statSpecs">-</b><span>参数</span></div>
        </div>
        <button id="themeBtn" class="theme-btn" type="button" aria-label="切换主题" title="切换深色/浅色主题">🌙</button>
      </div>
    </div>
  </header>

  <!-- TI 式主色横条：一条扛全部品牌感 -->
  <nav class="band" aria-label="主导航">
    <div class="band-in">
      <a class="on" href="#" data-page="catalog">产品</a>
      <a href="#" data-page="apps">应用</a>
      <a href="#" data-page="docs">技术文档</a>
      <a href="#" data-page="quality">封装与可靠性</a>
    </div>
  </nav>

  <!-- 面包屑：层级横着放 -->
  <nav id="crumb" class="crumb" aria-label="面包屑">
    <b>全部产品</b>
  </nav>

  <div class="shell">
    <!-- 搜索模式的结果区（默认隐藏，输入时接管） -->
    <div id="searchMode" class="hidden">
      <div id="resultBar" class="result-bar">
        <span id="resultSummary" class="result-summary"></span>
        <span id="resultCount" class="count-pill">0</span>
        <button id="clearBtn" class="btn-ghost" type="button">返回目录</button>
      </div>
      <div id="results" class="results"></div>
    </div>

    <!-- 目录模式：主页（只展示芯祥自有产品） -->
    <div id="catalogMode">
      <div class="cat-hero">
        <h2>产品目录</h2>
        <p id="catIntro">按大类逐层展开：工艺组 → 系列 → 功能 → 路数 → 型号。点击型号查看详情。</p>
        <div class="cat-tools">
          <button id="expandAll" class="btn-ghost" type="button">全部展开</button>
          <button id="collapseAll" class="btn-ghost" type="button">全部折叠</button>
          <input id="treeFilter" class="tree-filter" type="search"
                 placeholder="在目录里筛选：型号 / 功能 / 封装" autocomplete="off">
          <span id="treeFilterInfo" class="tree-filter-info"></span>
          <span id="catCount" class="count-pill">-</span>
        </div>
      </div>
      <div id="catTree" class="cat-tree"></div>
    </div>

    <!-- 栏目页：应用 / 技术文档 / 封装与可靠性 -->
    <div id="pageBody" class="page-body hidden"></div>

  </div>

  <div id="detail" class="drawer hidden" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <section class="drawer-panel" role="dialog" aria-modal="true">
      <div class="drawer-head">
        <div>
          <div class="head-line">
            <h2 id="detailModel"></h2>
            <button id="copyModelBtn" class="copy-btn" type="button" title="复制型号">复制</button>
            <span id="detailBadges" class="badges"></span>
          </div>
          <div class="nav-line">
            <button id="prevModel" class="nav-btn" type="button" title="上一个型号（←）">‹ 上一个</button>
            <button id="nextModel" class="nav-btn" type="button" title="下一个型号（→）">下一个 ›</button>
            <span id="navPos" class="nav-pos"></span>
          </div>
          <p id="detailDesc"></p>
        </div>
        <button id="closeDetail" type="button" aria-label="关闭">×</button>
      </div>
      <div id="detailMeta" class="meta-grid"></div>

      <section id="circuitWrap" class="pin-wrap hidden">
        <h3>应用电路图 <span class="pin-hint">点击放大</span></h3>
        <div class="pin-box circuit-box"><img id="circuitImg" src="" alt="Application circuit"></div>
      </section>
      <section id="pinWrap" class="pin-wrap hidden">
        <h3>引脚图 <span class="pin-hint">点击放大</span></h3>
        <div class="pin-box"><img id="pinImg" src="" alt="Pin diagram"></div>
      </section>

      <div class="detail-grid">
        <section class="card">
          <h3>电气参数 <span class="spec-hint">按类别分组</span></h3>
          <div class="spec-scroll">
            <table id="specTable" class="spec-table">
              <thead><tr><th>参数</th><th>数值</th></tr></thead>
              <tbody></tbody>
            </table>
            <div id="specEmpty" class="empty hidden">无参数</div>
          </div>
        </section>
        <aside class="card">
          <h3>同文档型号</h3>
          <div id="relatedDoc" class="related"></div>
          <h3>同功能型号</h3>
          <div id="relatedFunc" class="related"></div>
        </aside>
      </div>


    </section>
  </div>

  <div id="lightbox" class="lightbox hidden" aria-hidden="true">
    <div class="lightbox-mask" data-close></div>
    <figure class="lightbox-fig">
      <img id="lightboxImg" src="" alt="">
      <figcaption id="lightboxCap"></figcaption>
    </figure>
    <button id="lightboxClose" type="button" aria-label="关闭">×</button>
  </div>

  <script src="./app.js?v=20260926i"></script>
  <script src="./unified.js?v=20260926i"></script>

  <!-- 回到顶部：目录树滚动超过一屏时出现 -->
  <button id="toTop" class="to-top" type="button" aria-label="回到顶部" title="回到顶部">↑ 顶部</button>

</body>
</html>
