<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>芯祥产品目录</title>
  <link rel="stylesheet" href="./style.css?v=20260925n">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo">EM</div>
        <div class="brand-text">
          <h1>芯祥产品目录</h1>
        </div>
      </div>
      <div class="topbar-side">
        <div class="topbar-search">
          <input id="q" type="search" autocomplete="off"
                 placeholder="搜索型号，如 EM74LVC1G08、EM74AHC1G00（按 / 聚焦）">
        </div>
        <div class="topstats">
          <div class="stat"><b id="statModels">-</b><span>型号</span></div>
          <div class="stat"><b id="statSpecs">-</b><span>参数</span></div>
        </div>
        <button id="themeBtn" class="theme-btn" type="button" aria-label="切换主题" title="切换深色/浅色主题">🌙</button>
      </div>
    </div>
  </header>

  <!-- TI 式主色横条：一条扛全部品牌感 -->
  <nav class="band" aria-label="主导航">
    <div class="band-in">
      <a class="on" href="#" data-page="catalog">产品</a>
      <a href="#" data-page="apps">应用</a>
      <a href="#" data-page="docs">技术文档</a>
      <a href="#" data-page="quality">封装与可靠性</a>
    </div>
  </nav>

  <!-- 面包屑：层级横着放 -->
  <nav id="crumb" class="crumb" aria-label="面包屑">
    <b>全部产品</b>
  </nav>

  <div class="shell">
    <!-- 搜索模式的结果区（默认隐藏，输入时接管） -->
    <div id="searchMode" class="hidden">
      <div id="resultBar" class="result-bar">
        <span id="resultSummary" class="result-summary"></span>
        <span id="resultCount" class="count-pill">0</span>
        <button id="clearBtn" class="btn-ghost" type="button">返回目录</button>
      </div>
      <div id="results" class="results"></div>
    </div>

    <!-- 目录模式：主页（只展示芯祥自有产品） -->
    <div id="catalogMode">
      <div class="cat-hero">
        <h2>产品目录</h2>
        <p id="catIntro">按大类逐层展开：工艺组 → 系列 → 功能 → 路数 → 型号。点击型号查看详情。</p>
        <div class="cat-tools">
          <button id="expandAll" class="btn-ghost" type="button">全部展开</button>
          <button id="collapseAll" class="btn-ghost" type="button">全部折叠</button>
          <input id="treeFilter" class="tree-filter" type="search"
                 placeholder="在目录里筛选：型号 / 功能 / 封装" autocomplete="off">
          <span id="treeFilterInfo" class="tree-filter-info"></span>
          <span id="catCount" class="count-pill">-</span>
        </div>
      </div>
      <div id="catTree" class="cat-tree"></div>
    </div>

    <!-- 栏目页：应用 / 技术文档 / 封装与可靠性 -->
    <div id="pageBody" class="page-body hidden"></div>

    <!-- 兼容层：app.js 依赖的元素仍在 DOM 中（隐藏，不参与布局） -->
    <div class="legacy" hidden aria-hidden="true">
      <nav id="viewTabs"></nav>
      <div id="viewList" class="view"></div>
      <div id="viewSearch" class="view"></div>
      <div id="viewCompare" class="view"></div>
      <div id="viewComp" class="view"></div>
      <div id="filterBar" class="toolbar">
        <label>功能<select id="fFunction"></select></label>
        <label>系列<select id="fSeries"></select></label>
        <label>封装<select id="fPackage"></select></label>
        <label>逻辑<select id="fLogic"></select></label>
        <label>应用<select id="fApp"></select></label>
        <select id="fStatus"><option value="">全部</option></select>
      </div>
      <input id="cmpA" type="text" list="modelList" autocomplete="off">
      <input id="cmpB" type="text" list="modelList" autocomplete="off">
      <button id="cmpSwap" type="button"></button>
      <button id="cmpBtn" type="button"></button>
      <div id="cmpResult"></div>
      <div id="cmpEmpty" class="empty"></div>
      <input id="p2pQuery" class="p2p-input" type="search" autocomplete="off">
      <div id="p2pResults" class="p2p-results"></div>
      <div id="p2pEmpty" class="empty hidden"></div>
      <div id="compPanel" class="comp-panel hidden">
        <div class="comp-tabs" id="compVendorTabs">
          <button type="button" class="comp-vtab active" data-v="">全部</button>
          <button type="button" class="comp-vtab" data-v="TI">TI</button>
          <button type="button" class="comp-vtab" data-v="NXP">NXP</button>
          <button type="button" class="comp-vtab" data-v="SGM">圣邦</button>
          <button type="button" class="comp-vtab" data-v="AiP">中微爱芯</button>
          <button type="button" class="comp-vtab" data-v="DIOO">帝奥微</button>
        </div>
        <div class="comp-ctl">
          <input id="compQuery" class="p2p-input" type="search" placeholder="搜索型号 / 分类 / 功能" autocomplete="off">
          <select id="compCat" class="comp-cat"><option value="">全部分类</option></select>
        </div>
        <div id="compCount" class="comp-count"></div>
        <div id="compResults" class="comp-results"></div>
      </div>
      <table class="model-table"><tbody id="tableBody"></tbody></table>
      <div id="empty" class="empty hidden"></div>
    </div>
    <datalist id="modelList"></datalist>
  </div>

  <div id="detail" class="drawer hidden" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <section class="drawer-panel" role="dialog" aria-modal="true">
      <div class="drawer-head">
        <div>
          <div class="head-line">
            <h2 id="detailModel"></h2>
            <button id="copyModelBtn" class="copy-btn" type="button" title="复制型号">复制</button>
            <span id="detailBadges" class="badges"></span>
          </div>
          <div class="nav-line">
            <button id="prevModel" class="nav-btn" type="button" title="上一个型号（←）">‹ 上一个</button>
            <button id="nextModel" class="nav-btn" type="button" title="下一个型号（→）">下一个 ›</button>
            <span id="navPos" class="nav-pos"></span>
          </div>
          <p id="detailDesc"></p>
        </div>
        <button id="closeDetail" type="button" aria-label="关闭">×</button>
      </div>
      <div id="detailMeta" class="meta-grid"></div>

      <section id="circuitWrap" class="pin-wrap hidden">
        <h3>应用电路图 <span class="pin-hint">点击放大</span></h3>
        <div class="pin-box circuit-box"><img id="circuitImg" src="" alt="Application circuit"></div>
      </section>
      <section id="pinWrap" class="pin-wrap hidden">
        <h3>引脚图 <span class="pin-hint">点击放大</span></h3>
        <div class="pin-box"><img id="pinImg" src="" alt="Pin diagram"></div>
      </section>

      <div class="detail-grid">
        <section class="card">
          <h3>电气参数 <span class="spec-hint">按类别分组</span></h3>
          <div class="spec-scroll">
            <table id="specTable" class="spec-table">
              <thead><tr><th>参数</th><th>数值</th></tr></thead>
              <tbody></tbody>
            </table>
            <div id="specEmpty" class="empty hidden">无参数</div>
          </div>
        </section>
        <aside class="card">
          <h3>同文档型号</h3>
          <div id="relatedDoc" class="related"></div>
          <h3>同功能型号</h3>
          <div id="relatedFunc" class="related"></div>
        </aside>
      </div>

      <!-- 竞品信息：只在详情页出现，不在主页混入 -->
      <section id="compCard" class="ti-card hidden">
        <h3>竞品对标 <span id="compNote" class="ti-src"></span></h3>
        <div id="compList" class="ti-list"></div>
      </section>

      <section id="tiCard" class="ti-card hidden">
        <h3>TI 对标 <span id="tiNote" class="ti-src"></span></h3>
        <div id="tiList" class="ti-list"></div>
      </section>
    </section>
  </div>

  <div id="lightbox" class="lightbox hidden" aria-hidden="true">
    <div class="lightbox-mask" data-close></div>
    <figure class="lightbox-fig">
      <img id="lightboxImg" src="" alt="">
      <figcaption id="lightboxCap"></figcaption>
    </figure>
    <button id="lightboxClose" type="button" aria-label="关闭">×</button>
  </div>

  <script src="./app.js?v=20260925n"></script>
  <script src="./unified.js?v=20260925n"></script>
</body>
</html>
