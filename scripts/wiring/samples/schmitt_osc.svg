<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Helvetica,Arial,sans-serif">
<rect width="640" height="360" fill="#fff"/>
<text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">施密特反相器 RC 振荡器</text>
<text x="320" y="46" text-anchor="middle" font-size="11" fill="#666">EM74HC14 / EM74HCS14 · f ≈ 0.9/(R·C)</text>
<!-- VCC rail -->
<line x1="80" y1="90" x2="560" y2="90" stroke="#111" stroke-width="2"/>
<text x="70" y="94" text-anchor="end" font-size="13" fill="#111">VCC</text>
<!-- R from VCC -->
<line x1="200" y1="90" x2="200" y2="130" stroke="#111" stroke-width="2"/>
<rect x="192" y="130" width="16" height="50" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="216" y="158" font-size="13" fill="#111">R</text>
<line x1="200" y1="180" x2="200" y2="210" stroke="#111" stroke-width="2"/>
<!-- node A -->
<circle cx="200" cy="210" r="3.5" fill="#111"/>
<line x1="200" y1="210" x2="300" y2="210" stroke="#111" stroke-width="2"/>
<!-- inverter triangle -->
<polygon points="300,178 300,242 368,210" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="376" cy="210" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
<!-- hysteresis symbol inside -->
<path d="M312 224 h10 v-14 h10 v14 h10" fill="none" stroke="#111" stroke-width="1.6"/>
<!-- output B -->
<line x1="384" y1="210" x2="470" y2="210" stroke="#111" stroke-width="2"/>
<circle cx="470" cy="210" r="3.5" fill="#111"/>
<text x="478" y="206" font-size="13" fill="#111">OUT (osc)</text>
<!-- feedback: C from node A to node B -->
<line x1="200" y1="210" x2="200" y2="290" stroke="#111" stroke-width="2"/>
<line x1="200" y1="290" x2="400" y2="290" stroke="#111" stroke-width="2"/>
<line x1="400" y1="278" x2="400" y2="302" stroke="#111" stroke-width="2"/>
<line x1="412" y1="278" x2="412" y2="302" stroke="#111" stroke-width="2"/>
<line x1="412" y1="290" x2="470" y2="290" stroke="#111" stroke-width="2"/>
<line x1="470" y1="290" x2="470" y2="210" stroke="#111" stroke-width="2"/>
<text x="400" y="320" text-anchor="middle" font-size="13" fill="#111">C</text>
<!-- GND -->
<line x1="470" y1="90" x2="470" y2="130" stroke="#111" stroke-width="2"/>
<text x="478" y="115" font-size="13" fill="#111">IN tie VCC/GND</text>
<line x1="80" y1="330" x2="560" y2="330" stroke="#111" stroke-width="2"/>
<line x1="200" y1="302" x2="200" y2="330" stroke="#111" stroke-width="2"/>
<line x1="470" y1="330" x2="470" y2="330" stroke="#111" stroke-width="2"/>
<g transform="translate(470,330)">
  <line x1="-14" y1="0" x2="14" y2="0" stroke="#111" stroke-width="2"/>
  <line x1="-9" y1="5" x2="9" y2="5" stroke="#111" stroke-width="2"/>
  <line x1="-4" y1="10" x2="4" y2="10" stroke="#111" stroke-width="2"/>
</g>
<line x1="470" y1="302" x2="470" y2="330" stroke="#111" stroke-width="2"/>
<text x="60" y="350" font-size="10" fill="#999">芯祥FAE · 参考业界经典/TI应用笔记绘制</text>
</svg>