<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Helvetica,Arial,sans-serif">
<rect width="640" height="380" fill="#fff"/>
<text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">与非门按键消抖 SR 锁存器</text>
<text x="320" y="46" text-anchor="middle" font-size="11" fill="#666">EM74HC00 / EM74HCT00 · 机械开关无抖动输出</text>
<!-- VCC rail -->
<line x1="70" y1="80" x2="570" y2="80" stroke="#111" stroke-width="2"/>
<text x="60" y="84" text-anchor="end" font-size="13" fill="#111">VCC</text>
<!-- pullup R1 R2 -->
<line x1="170" y1="80" x2="170" y2="110" stroke="#111" stroke-width="2"/>
<rect x="162" y="110" width="16" height="44" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="186" y="136" font-size="13">R1 10k</text>
<line x1="170" y1="154" x2="170" y2="190" stroke="#111" stroke-width="2"/>
<circle cx="170" cy="190" r="3.5" fill="#111"/>
<line x1="300" y1="80" x2="300" y2="110" stroke="#111" stroke-width="2"/>
<rect x="292" y="110" width="16" height="44" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="316" y="136" font-size="13">R2 10k</text>
<line x1="300" y1="154" x2="300" y2="190" stroke="#111" stroke-width="2"/>
<circle cx="300" cy="190" r="3.5" fill="#111"/>
<!-- switches to GND -->
<line x1="170" y1="190" x2="170" y2="230" stroke="#111" stroke-width="2"/>
<line x1="170" y1="230" x2="160" y2="252" stroke="#111" stroke-width="2"/>
<line x1="170" y1="258" x2="170" y2="300" stroke="#111" stroke-width="2"/>
<circle cx="170" cy="234" r="3" fill="#111"/><circle cx="164" cy="254" r="3" fill="#111"/>
<text x="120" y="246" font-size="12">SW1</text>
<line x1="300" y1="190" x2="300" y2="230" stroke="#111" stroke-width="2"/>
<line x1="300" y1="230" x2="290" y2="252" stroke="#111" stroke-width="2"/>
<line x1="300" y1="258" x2="300" y2="300" stroke="#111" stroke-width="2"/>
<circle cx="300" cy="234" r="3" fill="#111"/><circle cx="294" cy="254" r="3" fill="#111"/>
<text x="250" y="246" font-size="12">SW2</text>
<line x1="70" y1="330" x2="570" y2="330" stroke="#111" stroke-width="2"/>
<line x1="170" y1="300" x2="170" y2="330" stroke="#111" stroke-width="2"/>
<line x1="300" y1="300" x2="300" y2="330" stroke="#111" stroke-width="2"/>
<g transform="translate(360,330)">
  <line x1="-14" y1="0" x2="14" y2="0" stroke="#111" stroke-width="2"/>
  <line x1="-9" y1="5" x2="9" y2="5" stroke="#111" stroke-width="2"/>
  <line x1="-4" y1="10" x2="4" y2="10" stroke="#111" stroke-width="2"/>
</g>
<line x1="360" y1="330" x2="360" y2="340" stroke="#111" stroke-width="2"/>
<line x1="70" y1="340" x2="570" y2="340" stroke="#111" stroke-width="0" />
<!-- cross-coupled NANDs -->
<!-- NAND1 (left, output Qbar) -->
<path d="M400 150 h40 a32 32 0 0 1 0 64 h-40 z" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="474" cy="182" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
<!-- NAND2 (right, output Q) -->
<path d="M400 240 h40 a32 32 0 0 1 0 64 h-40 z" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="474" cy="272" r="7" fill="#fff" stroke="#111" stroke-width="2"/>
<!-- inputs from switch nodes -->
<line x1="170" y1="190" x2="170" y2="176" stroke="#111" stroke-width="2" stroke-dasharray="0"/>
<line x1="170" y1="176" x2="400" y2="166" stroke="#111" stroke-width="2"/>
<line x1="300" y1="190" x2="300" y2="264" stroke="#111" stroke-width="2"/>
<line x1="300" y1="264" x2="400" y2="256" stroke="#111" stroke-width="2"/>
<!-- cross couple: N1 out(474,182) -> N2 input(400,296); N2 out(474,272) -> N1 input(400,198) -->
<line x1="481" y1="182" x2="540" y2="182" stroke="#111" stroke-width="2"/>
<line x1="540" y1="182" x2="540" y2="310" stroke="#111" stroke-width="2"/>
<line x1="540" y1="310" x2="370" y2="310" stroke="#111" stroke-width="2"/>
<line x1="370" y1="310" x2="370" y2="296" stroke="#111" stroke-width="2"/>
<line x1="370" y1="296" x2="400" y2="296" stroke="#111" stroke-width="2"/>
<line x1="481" y1="272" x2="560" y2="272" stroke="#111" stroke-width="2"/>
<line x1="560" y1="272" x2="560" y2="140" stroke="#111" stroke-width="2"/>
<line x1="560" y1="140" x2="390" y2="140" stroke="#111" stroke-width="2"/>
<line x1="390" y1="140" x2="390" y2="198" stroke="#111" stroke-width="2"/>
<line x1="390" y1="198" x2="400" y2="198" stroke="#111" stroke-width="2"/>
<!-- outputs -->
<text x="486" y="186" font-size="13">Q̅</text>
<text x="486" y="276" font-size="13">Q (去抖输出)</text>
<text x="60" y="368" font-size="10" fill="#999">芯祥FAE · 参考业界经典/TI应用笔记绘制</text>
</svg>